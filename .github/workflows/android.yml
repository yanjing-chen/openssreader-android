name: Android APK CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK 37.0
        run: |
          if ! sdkmanager --channel=3 "platforms;android-37.0" "build-tools;36.0.0"; then
            if command -v android >/dev/null 2>&1; then
              android sdk install platforms/android-37.0 build-tools/36.0.0
            else
              echo 'Android SDK Platform 37.0 unavailable from SDK manager' >&2
              exit 1
            fi
          fi
          test -s "$ANDROID_SDK_ROOT/platforms/android-37.0/android.jar"
      - name: Compile and test
        run: bash ./BUILD_ANDROID_6800H.sh
      - name: Release lint gate (same checks as signed APK)
        run: bash android/gradlew --no-daemon :app:lintVitalRelease
      - uses: actions/upload-artifact@v4
        with:
          name: OpenSSReader-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

name: Android Signed Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Require matching tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          grep -Fq "versionName = \"${TAG#v}\"" android/app/build.gradle.kts
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK 37.0
        run: |
          if ! sdkmanager --channel=3 "platforms;android-37.0" "build-tools;36.0.0"; then
            if command -v android >/dev/null 2>&1; then
              android sdk install platforms/android-37.0 build-tools/36.0.0
            else
              echo 'Android SDK Platform 37.0 unavailable from SDK manager' >&2
              exit 1
            fi
          fi
          test -s "$ANDROID_SDK_ROOT/platforms/android-37.0/android.jar"
      - name: Source and Android tests
        run: bash ./BUILD_ANDROID_6800H.sh
      - name: Restore private signing keystore
        env:
          STORE_B64: ${{ secrets.OSR_ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$STORE_B64" || { echo 'Missing release signing keystore secret' >&2; exit 1; }
          umask 077
          printf '%s' "$STORE_B64" | base64 --decode > "$RUNNER_TEMP/osr-release.keystore"
          test -s "$RUNNER_TEMP/osr-release.keystore"
      - name: Build signed APK
        env:
          OSR_SIGNING_STORE_PASSWORD: ${{ secrets.OSR_ANDROID_KEYSTORE_PASSWORD }}
          OSR_SIGNING_KEY_ALIAS: ${{ secrets.OSR_ANDROID_KEY_ALIAS }}
          OSR_SIGNING_KEY_PASSWORD: ${{ secrets.OSR_ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$OSR_SIGNING_STORE_PASSWORD" && test -n "$OSR_SIGNING_KEY_ALIAS" && test -n "$OSR_SIGNING_KEY_PASSWORD"
          export OSR_SIGNING_STORE_FILE="$RUNNER_TEMP/osr-release.keystore"
          bash android/gradlew --no-daemon :app:assembleRelease
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/OpenSSReader-Android-${GITHUB_REF_NAME}.apk"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --print-certs "dist/OpenSSReader-Android-${GITHUB_REF_NAME}.apk"
          (cd dist && sha256sum "OpenSSReader-Android-${GITHUB_REF_NAME}.apk" > "OpenSSReader-Android-${GITHUB_REF_NAME}.apk.sha256")
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/OpenSSReader-Android-${GITHUB_REF_NAME}.apk" \
            "dist/OpenSSReader-Android-${GITHUB_REF_NAME}.apk.sha256" \
            --verify-tag --title "OpenSSReader Android ${GITHUB_REF_NAME}" \
            --notes-file RELEASE_NOTES.md

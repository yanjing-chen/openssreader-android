# Official Android 1.0.8 release from tested E3 feature branch.
# This file is committed ONLY to feature/scan-enhancement-e3-fix1.
# It is evaluated at the v1.0.8 tag; main is not modified.
name: Android Signed Release
on:
  push:
    tags: ['v1.0.8']
permissions:
  contents: read
jobs:
  release:
    name: Verify, build and publish signed v1.0.8 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    permissions:
      contents: write
    steps:
      - name: Checkout tagged source (full history for branch check)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify tag, exact version, feature branch origin and retained fix
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -Eeuo pipefail
          [[ "$RELEASE_TAG" == 'v1.0.8' ]] || { echo 'Unexpected release tag' >&2; exit 1; }
          grep -Fqx '        versionCode = 10008' android/app/build.gradle.kts
          grep -Fqx '        versionName = "1.0.8"' android/app/build.gradle.kts
          grep -Fq 'import androidx.compose.foundation.horizontalScroll' android/app/src/main/java/org/openssreader/android/MainActivity.kt
          git fetch origin '+refs/heads/feature/scan-enhancement-e3-fix1:refs/remotes/origin/feature/scan-enhancement-e3-fix1'
          branch_sha="$(git rev-parse 'refs/remotes/origin/feature/scan-enhancement-e3-fix1')"
          tag_sha="$(git rev-parse HEAD)"
          [[ "$tag_sha" == "$branch_sha" ]] || { echo 'Tag is not the verified feature branch HEAD' >&2; exit 1; }
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK tools
        uses: android-actions/setup-android@v4
      - name: Install Android SDK Platform 37.0 and Build Tools 36.0.0
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! sdkmanager --channel=3 'platforms;android-37.0' 'build-tools;36.0.0'; then
            if command -v android >/dev/null 2>&1; then
              android sdk install platforms/android-37.0 build-tools/36.0.0
            else
              echo 'Android Platform 37.0 unavailable' >&2
              exit 1
            fi
          fi
          test -s "$ANDROID_SDK_ROOT/platforms/android-37.0/android.jar"
          test -x "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"
      - name: Run source checks, compile debug APK and unit tests
        shell: bash
        run: bash ./BUILD_ANDROID_6800H.sh
      - name: Release lint gate
        shell: bash
        run: bash android/gradlew --no-daemon :app:lintVitalRelease
      - name: Restore existing production signing keystore
        shell: bash
        env:
          STORE_B64: ${{ secrets.OSR_ANDROID_KEYSTORE_BASE64 }}
          OSR_SIGNING_STORE_PASSWORD: ${{ secrets.OSR_ANDROID_KEYSTORE_PASSWORD }}
          OSR_SIGNING_KEY_ALIAS: ${{ secrets.OSR_ANDROID_KEY_ALIAS }}
          OSR_SIGNING_KEY_PASSWORD: ${{ secrets.OSR_ANDROID_KEY_PASSWORD }}
        run: |
          set -Eeuo pipefail
          [[ -n "$STORE_B64" && -n "$OSR_SIGNING_STORE_PASSWORD" && -n "$OSR_SIGNING_KEY_ALIAS" && -n "$OSR_SIGNING_KEY_PASSWORD" ]] || {
            echo 'Production signing secrets missing; refusing unsigned release' >&2
            exit 1
          }
          umask 077
          printf '%s' "$STORE_B64" | base64 --decode > "$RUNNER_TEMP/osr-release.keystore"
          test -s "$RUNNER_TEMP/osr-release.keystore"
      - name: Build production-signed APK, check certificate matches v1.0.7, produce SHA256
        shell: bash
        env:
          OSR_SIGNING_STORE_PASSWORD: ${{ secrets.OSR_ANDROID_KEYSTORE_PASSWORD }}
          OSR_SIGNING_KEY_ALIAS: ${{ secrets.OSR_ANDROID_KEY_ALIAS }}
          OSR_SIGNING_KEY_PASSWORD: ${{ secrets.OSR_ANDROID_KEY_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          export OSR_SIGNING_STORE_FILE="$RUNNER_TEMP/osr-release.keystore"
          bash android/gradlew --no-daemon :app:assembleRelease
          mkdir -p dist "$RUNNER_TEMP/osr-previous-release"
          apk='dist/OpenSSReader-Android-v1.0.8.apk'
          cp android/app/build/outputs/apk/release/app-release.apk "$apk"
          signer="$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"
          "$signer" verify --print-certs "$apk"
          # Reuse the original certificate; accidental signing-key rotation would prevent safe updates.
          gh release download 'v1.0.7' -R "$GH_REPO" \
            -p 'OpenSSReader-Android-v1.0.7.apk' -D "$RUNNER_TEMP/osr-previous-release"
          old_apk="$RUNNER_TEMP/osr-previous-release/OpenSSReader-Android-v1.0.7.apk"
          test -s "$old_apk"
          old_cert="$("$signer" verify --print-certs "$old_apk" | awk -F': ' '/Signer #1 certificate SHA-256 digest:/{print $2;exit}')"
          new_cert="$("$signer" verify --print-certs "$apk" | awk -F': ' '/Signer #1 certificate SHA-256 digest:/{print $2;exit}')"
          [[ -n "$old_cert" && "$old_cert" == "$new_cert" ]] || {
            echo 'Release certificate differs from v1.0.7; refusing to publish' >&2
            exit 1
          }
          echo "Production signing certificate matches v1.0.7: $new_cert"
          (cd dist && sha256sum 'OpenSSReader-Android-v1.0.8.apk' > 'OpenSSReader-Android-v1.0.8.apk.sha256')
          test -s "$apk" && test -s "$apk.sha256"
      - name: Publish official stable Release and mark latest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          # Explicitly require the pushed tag; don't let gh create one on main.
          gh release create 'v1.0.8' \
            'dist/OpenSSReader-Android-v1.0.8.apk' \
            'dist/OpenSSReader-Android-v1.0.8.apk.sha256' \
            --verify-tag --latest --title 'OpenSSReader Android v1.0.8' \
            --notes-file 'RELEASE_NOTES.md'
